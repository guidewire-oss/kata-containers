# Socket diagnostics (NETLINK_SOCK_DIAG) with destroy support.
#
# The guest agent reaps stale workload sockets after a live-migration
# address renumber via SOCK_DESTROY (netlink sock-diag). Without
# CONFIG_INET_DIAG the diag DUMP itself fails and the reap is a silent
# no-op: dead-but-ESTABLISHED connections bound to the removed address
# survive every migration hop, and external peers (e.g. databases)
# accumulate the matching half-open zombies until their own keepalives
# fire. CONFIG_INET_DIAG_DESTROY provides the SOCK_DESTROY operation
# itself; TCP/UDP diag cover both protocols the agent reaps.
CONFIG_INET_DIAG=y
CONFIG_INET_TCP_DIAG=y
CONFIG_INET_UDP_DIAG=y
CONFIG_INET_DIAG_DESTROY=y
