on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Fork: upstream runs this matrix on self-hosted arm, s390x and ppc64le
# runners behind an ok-to-test label. This fork has no self-hosted runners
# and ships only amd64 and arm64, so the arm leg runs on GitHub's hosted
# ubuntu-24.04-arm runners on every pull request, as the parallel build and
# unit-test pass for the second architecture we publish. The s390x and
# ppc64le legs are dropped. The workflow keeps its upstream file name so
# the next sync merges cleanly.
name: Static checks arm64
jobs:
  skipper:
    uses: ./.github/workflows/gatekeeper-skipper.yaml
    with:
      commit-hash: ${{ github.event.pull_request.head.sha }}
      target-branch: ${{ github.event.pull_request.base.ref }}

  build-checks:
    needs: skipper
    if: ${{ needs.skipper.outputs.skip_static != 'yes' }}
    strategy:
      fail-fast: false
      matrix:
        instance:
          - "ubuntu-24.04-arm"
    uses: ./.github/workflows/build-checks.yaml
    with:
      instance: ${{ matrix.instance }}
