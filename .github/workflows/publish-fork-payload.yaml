name: Publish kata-deploy payload (fork)
# Fork-local workflow. Mirrors upstream payload-after-push.yaml but
# routes builds to ghcr.io/guidewire-oss/kata-containers/* instead of
# quay.io/kata-containers/*. Initial scope: amd64 only, manual trigger.
# Push trigger on dev is intentionally disabled until the pipeline is
# proven; flip when ready.

on:
  workflow_dispatch:
    inputs:
      tag-suffix:
        description: 'Optional suffix to append to the image tag'
        required: false
        type: string
        default: ''
      release-tag:
        description: >-
          Optional immutable release tag (e.g. 0.0.7-amd64) to copy the built
          image to. Only honoured for a build of dev; the tag must not exist yet.
        required: false
        type: string
        default: ''
  # push:
  #   branches:
  #     - dev

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-assets-amd64:
    # Grants are forwarded to the called workflow, which declares the same set.
    permissions:
      contents: read # check out the source
      packages: write # push build artifacts to the registry with GITHUB_TOKEN
      id-token: write # OIDC token for attest-build-provenance to sign the artifacts
      attestations: write # store the provenance attestations
    uses: ./.github/workflows/build-kata-static-tarball-amd64.yaml
    with:
      commit-hash: ${{ github.sha }}
      # push-to-registry=no avoids the quay.io login step and the
      # intermediate OCI image push. The unified kata-static.tar.zst
      # artifact still flows to the publish job via actions/upload-artifact.
      push-to-registry: 'no'
      target-branch: ${{ github.ref_name }}
    secrets:
      # Both secrets are workflow_call inputs but unused in our path
      # (no quay push, no nvidia kernel signing). GITHUB_TOKEN is
      # always present and serves as a harmless placeholder.
      QUAY_DEPLOYER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      KBUILD_SIGN_PIN: ${{ secrets.GITHUB_TOKEN }}

  publish-kata-deploy-payload-amd64:
    needs: build-assets-amd64
    # Grants are forwarded to the called workflow, which declares the same set.
    permissions:
      contents: read # check out the source
      packages: write # push the kata-deploy image to the registry with GITHUB_TOKEN
    # Upstream renamed publish-kata-deploy-payload.yaml to publish-kata-images.yaml
    # (4.x); same inputs, plus image-kind.
    uses: ./.github/workflows/publish-kata-images.yaml
    with:
      commit-hash: ${{ github.sha }}
      registry: ghcr.io
      repo: guidewire-oss/kata-containers/kata-deploy
      tag: dev-${{ github.sha }}${{ inputs.tag-suffix }}-amd64
      target-branch: ${{ github.ref_name }}
      runner: ubuntu-22.04
      arch: amd64
      image-kind: deploy
    secrets:
      QUAY_DEPLOYER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  tag-latest:
    name: tag-latest
    needs: publish-kata-deploy-payload-amd64
    # dev-latest-amd64 is what the layering workflows and the cluster-side
    # scripts default to. Only a build of dev may move it; a sync or feature
    # branch publishes under its own dev-<sha><suffix>-amd64 tag and stops.
    if: github.ref_name == 'dev'
    runs-on: ubuntu-22.04
    permissions:
      contents: read # baseline
      packages: write # skopeo re-tags the pushed image in the registry with GITHUB_TOKEN
    steps:
      - name: Login to ghcr.io
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Tag the per-arch image as dev-latest-amd64
        env:
          IMAGE: ghcr.io/guidewire-oss/kata-containers/kata-deploy
          SHA: ${{ github.sha }}
        run: |
          skopeo copy \
            "docker://${IMAGE}:dev-${SHA}-amd64" \
            "docker://${IMAGE}:dev-latest-amd64"

  tag-release:
    name: tag-release
    needs: publish-kata-deploy-payload-amd64
    # A release is a dev build copied to an immutable, human-readable tag that
    # the consuming chart pins (kata.image.tag). It is created once and never
    # moved: the copy refuses to overwrite an existing tag, so re-running a
    # release with the same name fails loudly instead of silently repointing it.
    if: github.ref_name == 'dev' && inputs.release-tag != ''
    runs-on: ubuntu-22.04
    permissions:
      contents: read # baseline
      packages: write # skopeo copies the pushed image to the release tag with GITHUB_TOKEN
    steps:
      - name: Login to ghcr.io
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Refuse to move an existing release tag
        env:
          IMAGE: ghcr.io/guidewire-oss/kata-containers/kata-deploy
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          if skopeo inspect --raw "docker://${IMAGE}:${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::release tag ${RELEASE_TAG} already exists; release tags are immutable"
            exit 1
          fi

      - name: Copy the per-arch image to the release tag
        env:
          IMAGE: ghcr.io/guidewire-oss/kata-containers/kata-deploy
          SHA: ${{ github.sha }}
          SUFFIX: ${{ inputs.tag-suffix }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          skopeo copy \
            "docker://${IMAGE}:dev-${SHA}${SUFFIX}-amd64" \
            "docker://${IMAGE}:${RELEASE_TAG}"
          echo "released ${IMAGE}:${RELEASE_TAG} <- dev-${SHA}${SUFFIX}-amd64" >> "$GITHUB_STEP_SUMMARY"
